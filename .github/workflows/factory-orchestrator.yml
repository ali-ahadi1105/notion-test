name: Software Factory Phase Orchestrator & Auto-Healer

on:
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  checks: read
  actions: read

jobs:
  software-factory-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Run Orchestrator and Auto-Healer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, json, re, urllib.request, urllib.error, urllib.parse

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          base_url = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "software-factory-orchestrator-action"
          }

          def api(method, path, body=None):
              data = json.dumps(body).encode("utf-8") if body else None
              req = urllib.request.Request(f"{base_url}{path}", data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      text = r.read().decode("utf-8")
                      return json.loads(text) if text.strip() else None
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      return None
                  raise

          # ===============================================================
          # PART 1: ADVANCE PHASES (Unblock downstream tasks when dependencies complete)
          # ===============================================================
          open_issues = api("GET", "/issues?state=open&per_page=100") or []
          open_issues = [i for i in open_issues if "pull_request" not in i]

          cache = {}
          def get_issue(num):
              if num not in cache:
                  cache[num] = api("GET", f"/issues/{num}") or {"state": "unknown"}
              return cache[num]

          for issue in open_issues:
              body = issue.get("body") or ""
              labels = [l["name"] if isinstance(l, dict) else str(l) for l in issue.get("labels", [])]
              blockers = set()
              
              meta = re.search(r"<!--\s*software-factory-metadata:\s*({.*?})\s*-->", body)
              if meta:
                  try:
                      for b in json.loads(meta.group(1)).get("blocked_by", []):
                          blockers.add(int(b))
                  except Exception:
                      pass
              
              for l in labels:
                  m = re.match(r"^blocked-by:#?(\d+)$", l, re.IGNORECASE)
                  if m:
                      blockers.add(int(m.group(1)))

              if not blockers:
                  continue
              if "openhands" in labels and "blocked" not in labels:
                  continue

              all_done = True
              resolved = []
              for b in sorted(blockers):
                  b_info = get_issue(b)
                  if b_info.get("state") == "closed":
                      resolved.append(f"#{b} ({b_info.get('title', '')})")
                  else:
                      all_done = False

              if all_done:
                  print(f"Unblocking issue #{issue['number']}: {issue['title']}")
                  if "blocked" in labels:
                      try:
                          api("DELETE", f"/issues/{issue['number']}/labels/blocked")
                      except Exception:
                          pass
                  for l in labels:
                      if re.match(r"^blocked-by:#?\d+$", l, re.IGNORECASE):
                          try:
                              api("DELETE", f"/issues/{issue['number']}/labels/{urllib.parse.quote(l)}")
                          except Exception:
                              pass
                  
                  api("POST", f"/issues/{issue['number']}/labels", {"labels": ["openhands", "status:ready"]})
                  
                  summary = "\n".join([f"- {r}" for r in resolved])
                  comment = (
                      f"### 🚀 All Dependencies Resolved!\n\n"
                      f"All prerequisite issues have been completed and closed:\n"
                      f"{summary}\n\n"
                      f"**Automated Actions Taken:**\n"
                      f"- Removed `blocked` status.\n"
                      f"- Added `openhands` trigger label.\n\n"
                      f"OpenHands Software Factory will now automatically begin implementation of this phase."
                  )
                  api("POST", f"/issues/{issue['number']}/comments", {"body": comment})

          # ===============================================================
          # PART 2: PR AUTO-HEALER (Detect CI failures and review change requests)
          # ===============================================================
          open_prs = api("GET", "/pulls?state=open&per_page=100") or []
          for pr in open_prs:
              branch = pr.get("head", {}).get("ref", "")
              if not branch.startswith("openhands/issue"):
                  continue

              pr_num = pr["number"]
              head_sha = pr["head"]["sha"]
              pr_labels = [l["name"] if isinstance(l, dict) else str(l) for l in pr.get("labels", [])]

              if "needs-human-attention" in pr_labels:
                  continue

              attempt = 0
              for l in pr_labels:
                  m = re.match(r"^fix-attempt:(\d+)$", l)
                  if m:
                      attempt = int(m.group(1))

              reasons = []

              # Check Check Runs
              checks = api("GET", f"/commits/{head_sha}/check-runs") or {}
              for c in checks.get("check_runs", []):
                  if c.get("conclusion") in ("failure", "timed_out", "action_required", "cancelled"):
                      c_name = c.get("name", "check")
                      out = c.get("output") or {}
                      summ = out.get("summary") or out.get("title") or c.get("conclusion")
                      reasons.append(f"CI check `{c_name}` failed ({c.get('conclusion')}): {summ[:150]}")

              # Check Reviews
              reviews = api("GET", f"/pulls/{pr_num}/reviews") or []
              latest_by_user = {}
              for r in reviews:
                  u = (r.get("user") or {}).get("login", "")
                  latest_by_user[u] = r
              for u, r in latest_by_user.items():
                  if r.get("state") == "CHANGES_REQUESTED":
                      b = (r.get("body") or "").strip()
                      reasons.append(f"Reviewer @{u} requested changes" + (f": {b[:150]}" if b else ""))

              if not reasons:
                  # If previously had fix-attempt labels and now clean, clean them up
                  if any(re.match(r"^fix-attempt:\d+$", l) for l in pr_labels) or "openhands-fix" in pr_labels:
                      for l in pr_labels:
                          if re.match(r"^fix-attempt:\d+$", l) or l == "openhands-fix":
                              try:
                                  api("DELETE", f"/issues/{pr_num}/labels/{urllib.parse.quote(l)}")
                              except Exception:
                                  pass
                      api("POST", f"/issues/{pr_num}/comments", {
                          "body": f"### ✅ Verifications Passed!\nAll CI checks and reviews are passing on `{head_sha[:7]}`. Ready for merge."
                      })
                  continue

              new_attempt = attempt + 1
              if new_attempt > 3:
                  # Escalate to human
                  for l in pr_labels:
                      if re.match(r"^fix-attempt:\d+$", l) or l == "openhands-fix":
                          try:
                              api("DELETE", f"/issues/{pr_num}/labels/{urllib.parse.quote(l)}")
                          except Exception:
                              pass
                  api("POST", f"/issues/{pr_num}/labels", {"labels": ["needs-human-attention"]})
                  esc_md = "\n".join([f"- {r}" for r in reasons])
                  api("POST", f"/issues/{pr_num}/comments", {
                      "body": f"### 🚨 Automated Repair Limit Reached ({attempt}/3 Attempts)\n\n"
                              f"OpenHands attempted to resolve this PR multiple times without success.\n\n"
                              f"**Blockers:**\n{esc_md}\n\nManual developer attention is required."
                  })
              else:
                  # Trigger repair revision
                  for l in pr_labels:
                      if re.match(r"^fix-attempt:\d+$", l):
                          try:
                              api("DELETE", f"/issues/{pr_num}/labels/{urllib.parse.quote(l)}")
                          except Exception:
                              pass
                  api("POST", f"/issues/{pr_num}/labels", {"labels": [f"fix-attempt:{new_attempt}", "openhands-fix"]})

                  # Set commit status to failure for software-factory/review to notify IssueToPR
                  api("POST", f"/statuses/{head_sha}", {
                      "state": "failure",
                      "context": "software-factory/review",
                      "description": f"Auto-repair needed: {reasons[0][:100]}"
                  })

                  reasons_md = "\n".join([f"- {r}" for r in reasons])
                  api("POST", f"/issues/{pr_num}/comments", {
                      "body": f"### 🔄 Automated Healing Loop Triggered (Attempt {new_attempt}/3)\n\n"
                              f"The factory detected the following issue(s) on commit `{head_sha[:7]}`:\n\n"
                              f"{reasons_md}\n\n"
                              f"**Action Taken:**\n"
                              f"- Flagged `software-factory/review` as `failure`.\n"
                              f"- OpenHands will check out `{branch}` and revise the PR."
                  })
          EOF
